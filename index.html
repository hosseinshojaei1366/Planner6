<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>برنامه‌ریز من</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef2f7;--card:#fff;--tx:#0f1b2d;--mu:#6b7a90;--pr:#12a594;--ac:#ffb020;--bad:#e5484d;--bd:#dfe6ef;--hd:#0f1b2d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1220;--card:#152036;--tx:#eaf0fa;--mu:#8fa0b8;--bd:#22304a;--hd:#0b1220}}
:root[data-theme="dark"]{--bg:#0b1220;--card:#152036;--tx:#eaf0fa;--mu:#8fa0b8;--bd:#22304a;--hd:#0b1220}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:'Vazirmatn',Tahoma,system-ui,sans-serif}
#app{max-width:520px;margin:0 auto;padding:14px 14px 96px}
.hero{background:linear-gradient(135deg,#0f1b2d,#173a4f);color:#fff;border-radius:24px;padding:20px;margin-bottom:14px}
.hero small{opacity:.7;font-size:13px}
.hero h1{margin:2px 0 10px;font-size:26px;font-weight:800}
.hero p{margin:0 0 14px;font-size:14px;line-height:1.8;opacity:.9}
.bar{height:10px;border-radius:9px;background:rgba(255,255,255,.18);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ac);border-radius:9px;transition:width .4s}
.pct{display:flex;justify-content:space-between;font-size:13px;margin-top:6px;opacity:.9}
.card{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:14px;margin-bottom:12px}
h2{font-size:16px;margin:0 0 10px}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--bd)}
.row:last-child{border:0}
.chk{width:26px;height:26px;border-radius:9px;border:2px solid var(--bd);background:none;color:#fff;font-size:15px;flex:none;padding:0}
.chk.on{background:var(--pr);border-color:var(--pr)}
.done{text-decoration:line-through;color:var(--mu)}
.x{background:none;border:0;color:var(--mu);font-size:20px;margin-inline-start:auto;padding:0 6px}
.add{display:flex;gap:8px;margin-top:8px}
input,select,textarea{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:14px;padding:11px 12px;min-width:0;width:100%}
.btn:disabled{opacity:.4}.bar.l{background:var(--bd)}.bar.l i{background:var(--pr)}textarea{resize:none;line-height:1.7}.btn{font:inherit;font-weight:600;background:var(--pr);color:#fff;border:0;border-radius:14px;padding:11px 18px;flex:none}
.seg{display:flex;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:4px;margin-bottom:12px}
.seg button{flex:1;font:inherit;border:0;background:none;color:var(--mu);padding:9px;border-radius:11px}
.seg button.on{background:var(--hd);color:#fff}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
.wd{font-size:11px;color:var(--mu)}
.day{font:inherit;border:1px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:14px;aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:14px;padding:0}
.day.sel{background:var(--hd);color:#fff;border-color:var(--hd)}
.day.today{border-color:var(--ac);border-width:2px}
.dot{width:5px;height:5px;border-radius:5px;background:var(--pr);margin-top:2px}
.dot.z{background:transparent}
.hb{display:flex;gap:5px;margin-inline-start:auto}
.hb button{width:24px;height:24px;border-radius:50%;border:2px solid var(--bd);background:none;padding:0;color:#fff;font-size:12px}
.hb button.on{background:var(--pr);border-color:var(--pr)}
.hb button.t{border-color:var(--ac)}
.streak{font-size:12px;color:var(--mu)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:12px;text-align:center}
.stat b{display:block;font-size:20px;direction:ltr}
.stat span{font-size:12px;color:var(--mu)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.pos{color:var(--pr)}.neg{color:var(--bad)}
.num{direction:ltr;unicode-bidi:embed;font-weight:600}
.mu{color:var(--mu);font-size:13px}
.empty{color:var(--mu);font-size:14px;padding:8px 0}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--bd);display:flex;justify-content:center;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
nav div{display:flex;width:100%;max-width:520px}
nav button{flex:1;font:inherit;font-size:12px;background:none;border:0;color:var(--mu);display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;border-radius:12px}
nav button span{font-size:22px}
nav button.on{color:var(--tx);font-weight:800}
nav button.on span{transform:scale(1.15)}
.toast{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:12px;right:12px;max-width:496px;margin:0 auto;background:var(--ac);color:#0f1b2d;border-radius:16px;padding:12px 16px;font-weight:600;z-index:9;box-shadow:0 8px 24px rgba(0,0,0,.3)}
.ring{width:92px;height:92px;border-radius:50%;background:conic-gradient(var(--pr) calc(var(--p)*1%),var(--bd) 0);display:grid;place-items:center;position:relative}
.ring:before{content:'';position:absolute;inset:9px;background:var(--card);border-radius:50%}.ring b{position:relative;font-size:18px}
input[type=range]{padding:0;accent-color:var(--pr)}nav button{font-size:11px}
.chk.miss{background:var(--bad);border-color:var(--bad)}
</style>
</head>
<body>
<div id="app"></div>
<nav><div id="nav"></div></nav>
<script>
const $=id=>document.getElementById(id);
const EMPTY=()=>({tasks:[],habits:[],trades:[]});
let S;try{S=JSON.parse(localStorage.getItem('planner1'))||EMPTY()}catch(e){S=EMPTY()}
const save=()=>{try{localStorage.setItem('planner1',JSON.stringify(S))}catch(e){}clearTimeout(window._sn);window._sn=setTimeout(syncN,1500)};
S.goals=S.goals||[];S.debts=S.debts||[];S.setups=S.setups||['شکست سطح (Breakout)','پولبک','چنج کاراکتر (CHoCH)','هانت نقدینگی','سفارش‌بلاک (Order Block)','ریورسال','ترند فالو'];S.tone=S.tone||'sys';S.nag=S.nag===undefined?10:S.nag;S.nagN=S.nagN||6;S.syms=S.syms||['XAUUSD','EURUSD','GBPUSD','USDJPY','GBPJPY','BTCUSD','ETHUSD','US30','NAS100','USOIL'];S.rep=S.rep||[];S.inc=S.inc||[];S.inst=S.inst||[];const TPL0=['بررسی خبرهای روز','بررسی جهت بازار','هانت نقدینگی','چنج','پولبک'];S.tpl=S.tpl||TPL0;if(S.tpl[0]==='روند کلی هم‌جهت با معامله است')S.tpl=TPL0;
const fn=x=>String(x).replace(/\d/g,c=>'۰۱۲۳۴۵۶۷۸۹'[c]);
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const fromIso=s=>new Date(s+'T12:00:00');
const addD=(d,n)=>{const r=new Date(d);r.setDate(r.getDate()+n);return r};
const MN=['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];
const WD=['شنبه','یکشنبه','دوشنبه','سه‌شنبه','چهارشنبه','پنجشنبه','جمعه'];
const PF=new Intl.DateTimeFormat('en-u-ca-persian',{year:'numeric',month:'numeric',day:'numeric'});
const jp=d=>{const o={};PF.formatToParts(d).forEach(p=>o[p.type]=p.value);return{y:+(o.year||o.relatedYear),m:+o.month,d:+o.day}};
const wi=d=>(d.getDay()+1)%7;
const QUOTES=['هر روز یک قدم کوچک، در یک سال یک مسیر بزرگ.','انضباط یعنی انجام دادن کار، حتی وقتی حالش نیست.','معامله‌گر خوب اول از ریسکش محافظت می‌کند.','عادت‌ها را تغییر بده، نتیجه‌ها خودشان تغییر می‌کنند.','امروز را کامل کن، فردا را بعداً برنامه‌ریزی کن.','پیشرفت یعنی بهتر از دیروز، نه بی‌عیب.','اول برنامه، بعد اقدام، بعد مرور.','صبر، بزرگ‌ترین سرمایه‌ی یک معامله‌گر است.','کار سخت امروز، آرامش فردای توست.','ضرر بخشی از بازی است؛ ندانستن دلیلش نه.','کوچک شروع کن، ولی امروز شروع کن.','تمرکز یعنی گفتن «نه» به چیزهای کم‌اهمیت.','قانون‌هایت را بشکنی، بازار تو را می‌شکند.','هر عادت خوب با یک تکرار ساده شروع می‌شود.','آن‌چه اندازه بگیری، بهتر می‌شود.','خستگی موقتی است، پشیمانی از رها کردن ماندگار.','معامله نکردن هم یک تصمیم درست است.','امروز همان فردایی است که دیروز نگرانش بودی.','مسیر را ادامه بده؛ سرعت مهم نیست، استمرار مهم است.','هدف بدون برنامه فقط یک آرزوست.'];
const today=iso(new Date());
let ui={tab:'today',sel:today,mode:'week',tt:'day',ts:'plan',ms:'inc',dr:[],dside:'buy',dsym:''};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const fmtDay=s=>{const d=fromIso(s),j=jp(d);return WD[wi(d)]+' '+fn(j.d)+' '+MN[j.m-1]};

const TT=[['day','روزانه'],['week','هفتگی'],['month','ماهانه'],['season','فصلی']];
const wk=x=>iso(addD(fromIso(x),-wi(fromIso(x))));
const pk=(ty,x)=>{const j=jp(fromIso(x));return ty==='day'?x:ty==='week'?wk(x):ty==='month'?j.y+'-'+j.m:j.y+'-s'+Math.ceil(j.m/3)};
const ttSeg=()=>'<div class="seg">'+TT.map(x=>'<button class="'+(ui.tt===x[0]?'on':'')+'" onclick="ui.tt=\''+x[0]+'\';render()">'+x[1]+'</button>').join('')+'</div>';
const PR={1:'🔴 ',2:'🟡 ',3:'🟢 '};
const gt=id=>{const g=S.goals.find(x=>x.id===id);return g?g.title:''};
function taskList(date,ty){ty=ty||'day';const k=pk(ty,date),ts=S.tasks.filter(t=>(t.type||'day')===ty&&pk(ty,t.date)===k).sort((a,b)=>(a.pr||2)-(b.pr||2));
  const lb={day:date===today?'امروز':fmtDay(date),week:'این هفته',month:'این ماه',season:'این فصل'}[ty];
  return '<div class="card"><h2>کارهای '+lb+'</h2>'+
  (ts.length?ts.map(t=>'<div class="row"><button class="chk '+(t.done?'on':t.missed?'miss':'')+'" onclick="tog(\''+t.id+'\')">'+(t.done?'✓':t.missed?'✕':'')+'</button><div><span class="'+(t.done?'done':'')+'">'+PR[t.pr||2]+(t.rid?'🔁 ':'')+esc(t.text)+'</span>'+(t.rem?'<div class="mu">⏰ '+fn(t.rem.slice(11))+(ty==='day'?'':' · '+fn(t.rem.slice(0,10)))+'</div>':'')+(t.pre?'<div class="mu">🔔 '+t.pre.lb+'</div>':'')+(t.g&&gt(t.g)?'<div class="mu">🎯 '+esc(gt(t.g))+'</div>':'')+(t.rem&&t.fired&&!t.done&&!t.missed?'<div style="display:flex;gap:6px;margin-top:6px"><button class="btn" style="padding:5px 12px;font-size:12px" onclick="setSt(\''+t.id+'\',1)">✓ انجام شد</button><button class="btn" style="padding:5px 12px;font-size:12px;background:var(--bad)" onclick="setSt(\''+t.id+'\',0)">✗ انجام نشد</button></div>':'')+'</div><button class="x" onclick="del(\'tasks\',\''+t.id+'\')">×</button></div>').join(''):'<div class="empty">هنوز کاری ثبت نشده. اولین کار را اضافه کن.</div>')+
  '<div class="add"><input id="ti" placeholder="کار جدید…" onkeydown="if(event.key===\'Enter\')addTask(\''+date+'\',\''+ty+'\')"></div><div class="add"><span class="mu" style="align-self:center;flex:none">⏰ یادآور</span><input id="tt" type="time">'+(ty==='day'?'<select id="tr" style="flex:none;width:auto" onchange="repOpts(this.value,\''+date+'\')"><option value="">🔁 بدون تکرار</option><option value="d">هر روز</option><option value="w">هفتگی (یک روز)</option><option value="x">چند روز در هفته</option><option value="m">ماهانه</option><option value="s">فصلی</option></select>':'<input id="td" type="date" value="'+date+'">')+'</div>'+(ty==='day'?'<div id="rx"></div>':'')+'<div class="add"><select id="tp"><option value="2">🟡 اولویت متوسط</option><option value="1">🔴 اولویت زیاد</option><option value="3">🟢 اولویت کم</option></select><select id="tb"><option value="">🔔 بدون یادآوری قبلی</option><option value="n">شب قبل</option><option value="1">۱ روز قبل</option><option value="2">۲ روز قبل</option><option value="3">۳ روز قبل</option></select></div><div class="add"><select id="tg"><option value="">بدون هدف</option>'+S.goals.map(g=>'<option value="'+g.id+'">🎯 '+esc(g.title)+'</option>').join('')+'</select>'+'<button class="btn" onclick="addTask(\''+date+'\',\''+ty+'\')">افزودن</button></div></div>'+
  (ty==='day'&&ui.tab==='plan'&&S.rep.length?'<div class="card"><h2>کارهای تکراری روزانه</h2>'+S.rep.map(r=>'<div class="row"><span>🔁 '+esc(r.text)+' <span class="mu">· '+repLabel(r)+(r.tm?' · ⏰ '+fn(r.tm):'')+'</span>'+'</span><button class="x" onclick="del(\'rep\',\''+r.id+'\')">×</button></div>').join('')+'</div>':'');
}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function addTask(date,ty){const v=$('ti').value.trim();if(!v)return;const tm=$('tt').value,rd=ty==='day'?date:($('td').value||date),g=$('tg').value,t={id:uid(),text:v,date,type:ty,done:false,pr:+$('tp').value};if(g)t.g=g;if(tm){t.rem=rd+'T'+tm;askN()}
  const fq=ty==='day'?$('tr').value:'',pn=$('tb').value;
  if(!fq&&pn){const n=pn==='n'?1:+pn,at=iso(addD(fromIso(rd),-n))+'T'+(pn==='n'?'20:00':(tm||'09:00')),nw=new Date(),ns=iso(nw)+'T'+pad(nw.getHours())+':'+pad(nw.getMinutes());if(at>ns)t.pre={at,lb:pn==='n'?'شب قبل':fn(n)+' روز قبل'}}
  if(fq){const j=jp(fromIso(date)),r={id:uid(),text:v,tm,g,last:date===today?today:'',freq:fq,start:date,pr:t.pr};
    if(fq==='w'||fq==='x'){r.days=[...document.querySelectorAll('#rx .day.sel')].map(b=>+b.dataset.i);if(!r.days.length)r.days=[wi(fromIso(date))]}
    if(fq==='m'||fq==='s'){r.dom=Math.min(31,Math.max(1,parseInt($('rdom').value)||j.d));if(fq==='s')r.m0=+$('rm0').value}
    S.rep.push(r);if(!dueOn(r,date)){save();render();toast('🔁 کار تکراری ثبت شد؛ در روزهای مقرر خودکار می‌آید');return}t.rid=r.id}
  S.tasks.push(t);save();render()}
function pickD(b,one){if(one)document.querySelectorAll('#rx .day').forEach(q=>q.classList.remove('sel'));b.classList.toggle('sel')}
function repOpts(v,date){const j=jp(fromIso(date)),h=t=>'<div class="mu" style="margin-top:6px">'+t+'</div>';
  $('rx').innerHTML=v==='w'||v==='x'?'<div class="grid" style="margin-top:8px">'+WD.map((w,i)=>'<button type="button" class="day" style="aspect-ratio:auto;padding:10px 0" data-i="'+i+'" onclick="pickD(this,'+(v==='w')+')">'+w.slice(0,1)+'</button>').join('')+'</div>'+h(v==='w'?'یک روز هفته را انتخاب کن':'روزهای هفته را تیک بزن، مثلاً شنبه، دوشنبه و چهارشنبه')
  :v==='m'||v==='s'?'<div class="add"><input id="rdom" type="number" min="1" max="31" inputmode="numeric" placeholder="روز ماه (۱ تا ۳۱)" value="'+j.d+'">'+(v==='s'?'<select id="rm0">'+MN.map((n,i)=>'<option value="'+(i+1)+'"'+(i+1===j.m?' selected':'')+'>'+n+'</option>').join('')+'</select>':'')+'</div>'+h(v==='m'?'هر ماه در این روز':'هر سه ماه یک بار، از ماه انتخاب‌شده')
  :v==='o'?h('از روز انتخاب‌شده شروع می‌شود و یک روز در میان تکرار می‌شود'):''}
const FQ={d:'هر روز',o:'یک روز در میان',w:'هفتگی',m:'ماهانه',s:'فصلی'};
function dueOn(r,x){const f=r.freq||'d',s0=r.start||x;if(x<s0)return false;const a=fromIso(x),b=fromIso(s0),ja=jp(a),jb=jp(b),ml=ja.m<=6?31:ja.m<=11?30:29;
  if(f==='d')return true;if(f==='o')return Math.round((a-b)/864e5)%2===0;
  if(f==='w'||f==='x')return(r.days&&r.days.length?r.days:[wi(b)]).includes(wi(a));
  const dm=Math.min(r.dom||jb.d,ml);if(f==='m')return ja.d===dm;
  return ja.d===dm&&(((ja.m-(r.m0||jb.m))%3)+3)%3===0}
const repLabel=r=>{const f=r.freq||'d',m0=r.m0||1;return f==='w'||f==='x'?(f==='x'?'چند روز در هفته: ':'هفتگی: ')+(r.days||[]).map(i=>WD[i]).join('، '):f==='m'?'ماهانه، روز '+fn(r.dom||'؟'):f==='s'?'فصلی، روز '+fn(r.dom||'؟')+' ('+[0,3,6,9].map(k=>MN[(m0-1+k)%12]).join('، ')+')':FQ[f]}
function ensureRep(){let ch=0;S.rep.forEach(r=>{if(r.last!==today){r.last=today;ch=1;if(dueOn(r,today)&&!S.tasks.some(t=>t.rid===r.id&&t.date===today)){const t={id:uid(),text:r.text,date:today,type:'day',done:false,rid:r.id,pr:r.pr};if(r.g)t.g=r.g;if(r.tm)t.rem=today+'T'+r.tm;S.tasks.push(t)}}});if(ch)save()}
function askN(){try{if('Notification' in window&&Notification.permission==='default')Notification.requestPermission()}catch(e){}}
function toast(m,id){if(id){beep();try{navigator.vibrate&&navigator.vibrate([300,150,300])}catch(x){}}if(id)document.querySelectorAll('.toast[data-id="'+id+'"]').forEach(x=>x.remove());const e=document.createElement('div');e.className='toast';e.dataset.id=id||'';e.innerHTML='<div>'+esc(m)+'</div>'+(id?'<div style="display:flex;gap:8px;margin-top:8px"><button class="btn" style="flex:1;background:#0f1b2d" onclick="setSt(\''+id+'\',1,this)">✓ انجام شد</button><button class="btn" style="flex:1;background:#fff;color:#0f1b2d" onclick="setSt(\''+id+'\',0,this)">✗ نشد</button></div><div style="display:flex;gap:6px;margin-top:6px">'+[[10,'۱۰ دقیقه بعد'],[60,'۱ ساعت بعد'],[1440,'فردا']].map(x=>'<button class="btn" style="flex:1;padding:7px 4px;font-size:12px;background:rgba(15,27,45,.15);color:#0f1b2d" onclick="snz(\''+id+'\','+x[0]+',this)">⏰ '+x[1]+'</button>').join('')+'</div>':'');if(!id)e.onclick=()=>e.remove();document.body.appendChild(e)}
function snz(id,mn,b){const t=S.tasks.find(x=>x.id===id),d=new Date(Date.now()+mn*6e4);t.rem=iso(d)+'T'+pad(d.getHours())+':'+pad(d.getMinutes());t.fired=0;t.nc=0;save();if(b)b.closest('.toast').remove();render()}
function chk(){const n=new Date(),now=iso(n)+'T'+pad(n.getHours())+':'+pad(n.getMinutes());
  S.tasks.filter(t=>t.rem&&!t.done&&!t.missed&&t.rem<=now&&(!t.fired||(S.nag>0&&(t.nc||0)<S.nagN&&Date.now()-t.fired>S.nag*6e4))).forEach(t=>{t.nc=t.fired?(t.nc||0)+1:0;t.fired=Date.now();save();toast('⏰ '+t.text,t.id);try{if(Notification.permission==='granted')new Notification('یادآور',{body:t.text})}catch(e){}});
  S.tasks.filter(t=>t.pre&&!t.pre.f&&!t.done&&t.pre.at<=now).forEach(t=>{t.pre.f=1;save();toast('🔔 '+t.pre.lb+': '+t.text)})}
function tog(id){const t=S.tasks.find(x=>x.id===id);if(t.done){t.done=false;t.missed=true}else if(t.missed)t.missed=false;else t.done=true;save();render()}
function setSt(id,ok,b){const t=S.tasks.find(x=>x.id===id);t.done=!!ok;t.missed=!ok;save();if(b)b.closest('.toast').remove();render()}
function del(k,id){S[k]=S[k].filter(x=>x.id!==id);save();render()}

function viewToday(){
  const ts=S.tasks.filter(t=>t.date===today),hs=S.habits;
  const total=ts.length+hs.length,dn=ts.filter(t=>t.done).length+hs.filter(h=>h.days[today]).length;
  const p=total?Math.round(dn/total*100):0;
  const d=new Date(),j=jp(d);
  return '<div class="hero"><small>'+WD[wi(d)]+'</small><h1>'+fn(j.d)+' '+MN[j.m-1]+' '+fn(j.y)+'</h1><p>'+QUOTES[Math.floor(d/864e5)%QUOTES.length]+'</p><div class="bar"><i style="width:'+p+'%"></i></div><div class="pct"><span>پیشرفت امروز</span><span>'+fn(p)+'٪</span></div></div>'+taskList(today)+weekStats()+notifCard();
}
function weekStats(){

  '<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px"><button class="x" style="margin:0;font-size:24px" onclick="nav1(1)">›</button><b>'+title+'</b><button class="x" style="margin:0;font-size:24px" onclick="nav1(-1)">‹</button></div><div class="grid" style="margin-bottom:6px">'+head+'</div><div class="grid">'+cells+'</div></div>'+ttSeg()+taskList(ui.sel,ui.tt);

const pnl=t=>t.pl!==undefined?t.pl:(t.exit-t.entry)*t.size*(t.side==='sell'?-1:1);
const TR=st=>S.trades.filter(t=>(t.status||'closed')===st);
const SD=t=>t.side==='sell'?'فروش':'خرید';
function tradeParts(){
  const T=TR('closed'),tot=T.reduce((a,t)=>a+pnl(t),0),w=T.filter(t=>pnl(t)>0).length,wr=T.length?Math.round(w/T.length*100):0;
  const plans=TR('plan').map(t=>{const ok=t.conds.filter(c=>c.ok).length,n=t.conds.length,all=ok===n;
    return '<div class="card"><div style="display:flex;align-items:center"><b>'+esc(t.symbol)+'</b><span class="mu" style="margin-inline-start:8px">'+SD(t)+'</span><button class="x" onclick="del(\'trades\',\''+t.id+'\')">×</button></div>'+
    t.conds.map((c,i)=>'<div class="row"><button class="chk '+(c.ok?'on':'')+'" onclick="cond(\''+t.id+'\','+i+')">'+(c.ok?'✓':'')+'</button><span class="'+(c.ok?'done':'')+'">'+esc(c.t)+'</span></div>').join('')+

    '<button class="btn" style="width:100%" '+(all?'':'disabled')+' onclick="enter(\''+t.id+'\')">'+(all?'ورود به معامله':'منتظر تحقق '+fn(n-ok)+' پیش‌فرض')+'</button></div>'}).join('');
  const open=TR('open').map(t=>'<div class="card"><div style="display:flex;align-items:center"><b>'+esc(t.symbol)+'</b><span class="mu" style="margin-inline-start:8px">'+SD(t)+' · <span class="num">'+t.entry+' × '+t.size+'</span></span><button class="x" onclick="del(\'trades\',\''+t.id+'\')">×</button></div><div class="add"><input id="px'+t.id+'" type="number" inputmode="decimal" placeholder="قیمت خروج"><button class="btn" onclick="closeT(\''+t.id+'\')">بستن</button></div>'+imgPanel(t)+'</div>').join('');
  const list=[...T].reverse().map(t=>{const p=pnl(t),d=jp(fromIso(t.date));return '<div class="row"><div><b>'+esc(t.symbol)+'</b> <span class="mu">'+SD(t)+' · '+fn(d.d)+' '+MN[d.m-1]+'</span>'+(t.entry!==undefined?'<div class="mu num">'+t.entry+' ← '+t.exit+' × '+t.size+'</div>':'')+(t.note?'<div class="mu">'+esc(t.note)+'</div>':'')+(t.src?'<div class="mu">'+t.src+'</div>':'')+(t.conds?'<div class="mu">'+fn(t.conds.length)+' پیش‌فرض محقق شد</div>':'')+'</div><span class="num '+(p>=0?'pos':'neg')+'" style="margin-inline-start:auto">'+(p>=0?'+':'')+p.toFixed(2)+'</span><button class="x" style="margin:0" onclick="del(\'trades\',\''+t.id+'\')">×</button></div>'+imgPanel(t)}).join('');
  return{T,tot,wr,plans,open,list};
}

  '<button class="btn" style="width:100%;margin-top:8px;background:var(--hd)" onclick="addPlan()">ذخیره برای بعد</button>'+symMgr()+'<details style="margin-top:12px"><summary class="mu">ویرایش قالب چک‌لیست</summary><textarea id="tc" rows="6" style="margin:8px 0">'+esc(S.tpl.join('\n'))+'</textarea><button class="btn" style="width:100%" onclick="saveTpl()">ذخیره قالب</button></details></div>'+(plans?'<h2 style="margin:16px 4px 8px">پلن‌های ذخیره‌شده</h2>'+plans:'')+(open?'<h2 style="margin:16px 4px 8px">معامله‌های باز</h2>'+open:'')}
  else if(ui.ts==='res')b='<div class="card"><h2>ثبت دستی نتیجه</h2><div class="g2">'+symSel('ms',S.syms[0],'')+''+sel.replace('MK','mk')+'</div><div class="g2"><input id="mp" type="number" inputmode="decimal" placeholder="سود یا زیان (مثلاً -25)"><input id="mn" placeholder="یادداشت"></div><button class="btn" style="width:100%" onclick="addRes()">ثبت نتیجه</button>'+symMgr()+'</div><div class="card"><h2>ورود از متاتریدر</h2><p class="mu" style="margin:0 0 10px;line-height:1.8">در MT4 یا MT5 توی تب History راست‌کلیک کن، گزارش را با فرمت HTML یا CSV ذخیره کن و اینجا انتخاب کن.</p><input type="file" accept=".csv,.htm,.html,.txt" onchange="impMT(this)">'+(ui.msg?'<div class="pos" style="margin-top:8px">'+ui.msg+'</div>':'')+'</div><div class="card"><h2>تاریخچه</h2>'+(list||'<div class="empty">هنوز نتیجه‌ای ثبت نشده.</div>')+'</div>';
  else if(ui.ts==='jr')b=viewJournal();else b=viewStats(T);
  return '<div class="hero"><small>ژورنال</small><h1>ترید</h1><p>اول پیش‌فرض‌ها را چک کن، بعد وارد معامله شو، آخرش مرور کن.</p></div><div class="stats"><div class="stat"><b class="'+(tot>=0?'pos':'neg')+'">'+tot.toFixed(2)+'</b><span>سود و زیان کل</span></div><div class="stat"><b>'+wr+'%</b><span>نرخ برد</span></div><div class="stat"><b>'+T.length+'</b><span>معامله بسته‌شده</span></div></div>'+todayCard()+'<div class="seg">'+sub+'</div>'+b;

function saveTpl(){const c=$('tc').value.split('\n').map(x=>x.trim()).filter(Boolean);if(c.length){S.tpl=c;save();ui.dr=[];render();toast('قالب چک‌لیست ذخیره شد')}}
function addRes(){const s=$('ms').value.trim(),p=parseFloat($('mp').value);if(!s||isNaN(p)){alert('نماد و سود یا زیان را وارد کن.');return}S.trades.push({id:uid(),date:today,symbol:s,side:$('mk').value,pl:p,note:$('mn').value.trim(),status:'closed'});save();render()}
function impMT(el){const f=el.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const txt=String(r.result);let rows;
  if(/<table/i.test(txt)){const d=new DOMParser().parseFromString(txt,'text/html');rows=[...d.querySelectorAll('tr')].map(tr=>[...tr.children].map(c=>c.textContent.trim()))}
  else{const dl=[';','\t',','].sort((a,b)=>txt.split(b).length-txt.split(a).length)[0];rows=txt.split(/\r?\n/).map(l=>l.split(dl).map(c=>c.replace(/^"|"$/g,'').trim()))}
  const hi=rows.findIndex(x=>{const l=x.map(c=>c.toLowerCase());return l.includes('profit')&&(l.includes('symbol')||l.includes('item'))});
  if(hi<0){ui.msg='ستون‌های فایل شناخته نشد. گزارش را با فرمت HTML یا CSV ذخیره کن.';render();return}
  const H=rows[hi].map(c=>c.toLowerCase()),ix=n=>H.indexOf(n),iS=H.includes('symbol')?ix('symbol'):ix('item'),iT=ix('type'),iP=H.lastIndexOf('profit'),iC=ix('commission'),iW=ix('swap'),iK=ix('ticket')>=0?ix('ticket'):ix('position'),iD=ix('open time')>=0?ix('open time'):ix('time');
  const nm=v=>parseFloat(String(v||'').replace(/[\s\u00a0]/g,'').replace(',','.'));let n=0;
  rows.slice(hi+1).forEach(x=>{const ty=(x[iT]||'').toLowerCase(),p=nm(x[iP]);if(!/^(buy|sell)$/.test(ty)||isNaN(p))return;const ref=iK>=0?x[iK]:'';if(ref&&S.trades.some(t=>t.ref===ref))return;
    const d=(x[iD]||'').match(/(\d{4})[.\-\/](\d{2})[.\-\/](\d{2})/);
    S.trades.push({id:uid(),ref,date:d?d[1]+'-'+d[2]+'-'+d[3]:today,symbol:x[iS]||'?',side:ty,pl:p+(nm(x[iC])||0)+(nm(x[iW])||0),src:'متاتریدر',status:'closed'});n++});
  save();ui.msg=n?fn(n)+' معامله وارد شد.':'معامله‌ای پیدا نشد یا قبلاً وارد شده.';render()};r.readAsText(f)}
function viewStats(T){
  if(!T.length)return '<div class="card empty">برای دیدن تحلیل، اول چند نتیجه معامله ثبت یا وارد کن.</div>';
  const O=[...T].sort((a,b)=>a.date<b.date?-1:1),ps=O.map(pnl),win=ps.filter(p=>p>0),los=ps.filter(p=>p<0),gp=win.reduce((a,b)=>a+b,0),gl=-los.reduce((a,b)=>a+b,0);
  let c=0,pe=0,dd=0;const eq=ps.map(p=>c+=p);eq.forEach(v=>{pe=Math.max(pe,v);dd=Math.max(dd,pe-v)});
  const mx=Math.max(...eq,0),mn=Math.min(...eq,0),rg=(mx-mn)||1,pts=eq.map((v,i)=>(eq.length>1?i/(eq.length-1)*300:150)+','+(90-(v-mn)/rg*80)).join(' ');
  const K=(l,v,cl)=>'<div class="stat"><b class="'+(cl||'')+'">'+v+'</b><span>'+l+'</span></div>';
  const by=k=>{const m={};O.forEach(t=>{const x=k(t),p=pnl(t);m[x]=m[x]||{n:0,p:0,w:0};m[x].n++;m[x].p+=p;if(p>0)m[x].w++});return Object.entries(m).sort((a,b)=>b[1].p-a[1].p).slice(0,6).map(([k,v])=>'<div class="row"><b>'+esc(k)+'</b><span class="mu">'+fn(v.n)+' معامله · برد '+fn(Math.round(v.w/v.n*100))+'٪</span><span class="num '+(v.p>=0?'pos':'neg')+'" style="margin-inline-start:auto">'+v.p.toFixed(2)+'</span></div>').join('')};
  const net=gp-gl,wrp=Math.round(win.length/O.length*100),mo={};O.forEach((t,i)=>{const k=t.date.slice(0,7);mo[k]=(mo[k]||0)+ps[i]});const ms=Object.entries(mo).slice(-6),mm=Math.max(...ms.map(x=>Math.abs(x[1])),1);
  const mb=ms.map(([k,v])=>'<div style="margin:10px 0"><div style="display:flex;justify-content:space-between;font-size:13px"><span>'+MN[jp(fromIso(k+'-15')).m-1]+'</span><span class="num '+(v>=0?'pos':'neg')+'">'+v.toFixed(2)+'</span></div><div style="height:8px;border-radius:6px;margin-top:4px;background:'+(v>=0?'var(--pr)':'var(--bad)')+';width:'+Math.max(4,Math.abs(v)/mm*100)+'%"></div></div>').join('');
  const top='<div class="hero" style="display:flex;align-items:center;justify-content:space-between"><div><small>سود و زیان خالص</small><h1 class="num" style="margin:4px 0;color:'+(net>=0?'#5eead4':'#ff8a80')+'">'+(net>=0?'+':'')+net.toFixed(2)+'</h1><small>'+fn(O.length)+' معامله · '+fn(win.length)+' برد · '+fn(los.length)+' باخت</small></div><div class="ring" style="--p:'+wrp+';--card:#173a4f;--bd:rgba(255,255,255,.2)"><b>'+fn(wrp)+'٪</b></div></div>';
  return top+lineCards(O)+'<div class="card" hidden><h2>منحنی سرمایه</h2><svg viewBox="0 0 300 100" style="width:100%"><polyline points="'+pts+'" fill="none" stroke="var(--pr)" stroke-width="2.5" stroke-linejoin="round"/></svg></div><div class="stats">'+K('ضریب سود',gl?(gp/gl).toFixed(2):'∞')+K('میانگین برد',win.length?(gp/win.length).toFixed(2):'0','pos')+K('میانگین باخت',los.length?(-gl/los.length).toFixed(2):'0','neg')+K('امید ریاضی',((gp-gl)/O.length).toFixed(2))+K('بهترین',Math.max(...ps).toFixed(2),'pos')+K('بدترین',Math.min(...ps).toFixed(2),'neg')+'</div><div class="card"><h2>بیشینه افت سرمایه</h2><b class="num neg">'+dd.toFixed(2)+'</b></div><div class="card"><h2>سود و زیان ماهانه</h2>'+mb+'</div>'+symCards(O)+jCards(O)+'<div class="card"><h2>بر اساس نماد</h2>'+by(t=>t.symbol)+'</div><div class="card"><h2>خرید در برابر فروش</h2>'+by(t=>SD(t))+'</div><button class="btn" style="width:100%" onclick="shareRep()">اشتراک گزارش</button>';
}
function dtick(i){ui.dr[i]=!ui.dr[i];render();if(S.tpl.every((c,j)=>ui.dr[j]))toast('✅ همه شرایط محقق شد، وارد معامله شو')}
function enterNow(){const s=$('ts').value.trim(),e=parseFloat($('de').value),z=parseFloat($('dz').value);if(!s||isNaN(e)||isNaN(z)){alert('نماد، قیمت ورود و حجم را وارد کن.');return}
