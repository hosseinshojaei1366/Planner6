{"name":"Build APK","on":["push","workflow_dispatch"],"jobs":{"build":{"runs-on":"ubuntu-latest","steps":[
{"uses":"actions/checkout@v4"},
{"uses":"actions/setup-node@v4","with":{"node-version":20}},
{"uses":"actions/setup-java@v4","with":{"distribution":"temurin","java-version":17}},
{"run":"mkdir -p www && cp index.html www/index.html"},
{"run":"npm install"},
{"run":"npx cap add android"},
{"run":"python3 mktones.py && mkdir -p android/app/src/main/res/raw && cp tone_*.wav android/app/src/main/res/raw/"},
{"run":"sed -i 's#</manifest>#<uses-permission android:name=\\\"android.permission.POST_NOTIFICATIONS\\\"/><uses-permission android:name=\\\"android.permission.SCHEDULE_EXACT_ALARM\\\"/><uses-permission android:name=\\\"android.permission.USE_EXACT_ALARM\\\"/></manifest>#' android/app/src/main/AndroidManifest.xml"},
{"run":"npx cap sync android"},
{"run":"cd android && chmod +x gradlew && ./gradlew assembleDebug"},
{"uses":"actions/upload-artifact@v4","with":{"name":"planner-apk","path":"android/app/build/outputs/apk/debug/app-debug.apk"}}
]}}}
